[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuronection-auth-kit"
version = "0.1.0"
description = "Family identity & authentication library: tokens, passwords, sessions, cookies/CSRF, instance access modes"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "bcrypt>=4.1",
    "PyJWT>=2.8",
    "SQLAlchemy>=2.0.25",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nx_auth"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["scripts/version_manager.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "SIM", "UP"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
