[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuronection-auth-kit"
version = "0.7.0"
description = "Family identity & authentication library: tokens, passwords, sessions, cookies/CSRF, instance access modes"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "bcrypt>=4.1",
    "PyJWT>=2.8",
    "SQLAlchemy>=2.0.25",
    "cryptography>=42",
]

[project.urls]
Homepage = "https://github.com/neuronection/auth-kit"
Repository = "https://github.com/neuronection/auth-kit"
Changelog = "https://github.com/neuronection/auth-kit/blob/main/CHANGELOG.md"
Issues = "https://github.com/neuronection/auth-kit/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
    # Tests only: the keyring package is OPTIONAL at runtime (lazy import;
    # a host without it resolves keyring→none and keeps the sealed-file or
    # env path). The suite fakes it everywhere except one case that proves
    # the real `keyring.backends.null` is rejected by the probe.
    "keyring>=25",
]
# plan 21 D2: the multi-process counter backend (uvicorn workers + Celery
# sharing one Redis). Optional — the in-memory counter is the default and
# the limiter degrades open when the backend is unreachable.
redis = [
    "redis>=5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nx_auth"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored family contract modules must stay BYTE-identical to their dev
# canonicals (ADR-0031/0035/0040) — excluded from lint and format; findings
# belong to the canonical, not the vendored copy (same accommodation for the
# cloud, retrieval, vector/tokenizer and model-pricing contracts).
extend-exclude = [
    "app/extensions/contract.py",
    "app/extensions/polite_http.py",
    "app/extensions/conformance.py",
    "app/extensions/extension_sources.py",
    "app/extensions/search/providers_contract.py",
    "app/extensions/isolation.py",
    "app/ai/flow_events.py",
    "app/extensions/cloud/cloud_calendar.py",
    "app/extensions/cloud/cloud_files.py",
    "app/extensions/cloud/cloud_providers.py",
    "app/storage/retrieval_ops.py",
    "app/storage/vector_contract.py",
    "app/storage/tokenizer_contract.py",
    "app/storage/object_storage.py",
    "app/storage/object_storage_migrate.py",
    "app/ai/model_pricing.py",
    "app/ai/model_pricing_data.py",
    "tests/cloud_conformance.py",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # identity-auth §18 contract cases — the drift gate against the family
    # test kit (CI runs `pytest -m contract` as an explicit step).
    "contract: implements an identity-auth §18 contract case (family drift gate)",
]
