[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuronection-auth-kit"
version = "0.3.1"
description = "Family identity & authentication library: tokens, passwords, sessions, cookies/CSRF, instance access modes"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "bcrypt>=4.1",
    "PyJWT>=2.8",
    "SQLAlchemy>=2.0.25",
    "cryptography>=42",
]

[project.urls]
Homepage = "https://github.com/neuronection/auth-kit"
Repository = "https://github.com/neuronection/auth-kit"
Changelog = "https://github.com/neuronection/auth-kit/blob/main/CHANGELOG.md"
Issues = "https://github.com/neuronection/auth-kit/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nx_auth"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # identity-auth §18 contract cases — the drift gate against the family
    # test kit (CI runs `pytest -m contract` as an explicit step).
    "contract: implements an identity-auth §18 contract case (family drift gate)",
]
